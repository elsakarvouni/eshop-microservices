<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Εγγραφή - Το e-Shop μου</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
        <h3 class="text-center mb-4">Δημιουργία Λογαριασμού</h3>

        <div id="registerAlert"></div>

        <form id="registerForm">
            <div class="mb-3">
                <label for="name" class="form-label">Όνομα</label>
                <input type="text" class="form-control" id="name" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Κωδικός Πρόσβασης</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" required>
                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="password">
                        👁️
                    </button>
                </div>
            </div>
            
            <div class="mb-3">
                <label for="confirmPassword" class="form-label">Επιβεβαίωση Κωδικού</label>
                <div class="input-group">
                    <input type="password" class="form-control" id="confirmPassword" required>
                    <button class="btn btn-outline-secondary toggle-password" type="button" data-target="confirmPassword">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 mb-3">Εγγραφή</button>
        </form>

        <div class="text-center">
            <small>Έχεις ήδη λογαριασμό; <a href="login.html">Κάνε Είσοδο</a></small>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
